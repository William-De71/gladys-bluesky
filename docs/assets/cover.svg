<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <!-- Cover of the Bluesky integration for Gladys Assistant. The butterfly is
       the official Bluesky logo, path copied unchanged from
       bluesky-social/social-app (bskyembed/assets/logo.svg, MIT repository;
       the logo is a trademark of Bluesky Social PBC). The rest is an
       illustration: a direct message conversation with Gladys and the
       notifications of the account. Built into cover.jpg by
       scripts/build-cover.sh. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0a5fd0"/>
      <stop offset="0.55" stop-color="#2f8cff"/>
      <stop offset="1" stop-color="#9cc9ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <!-- soft clouds -->
  <g fill="#ffffff" opacity="0.14">
    <ellipse cx="130" cy="470" rx="190" ry="34"/>
    <ellipse cx="660" cy="500" rx="230" ry="40"/>
    <ellipse cx="640" cy="70" rx="160" ry="22"/>
  </g>

  <!-- logo card and title -->
  <g filter="url(#shadow)">
    <rect x="56" y="62" width="148" height="148" rx="34" fill="#06306b" fill-opacity="0.3"/>
  </g>
  <rect x="56" y="56" width="148" height="148" rx="34" fill="#ffffff"/>
  <svg x="78" y="88" width="104" height="93" viewBox="0 0 320 286">
    <path fill="#0a7aff" d="M69.364 19.146c36.687 27.806 76.147 84.186 90.636 114.439 14.489-30.253 53.948-86.633 90.636-114.439C277.107-.917 320-16.44 320 32.957c0 9.865-5.603 82.875-8.889 94.729-11.423 41.208-53.045 51.719-90.071 45.357 64.719 11.12 81.182 47.953 45.627 84.785-80 82.874-106.667-44.333-106.667-44.333s-26.667 127.207-106.667 44.333c-35.555-36.832-19.092-73.665 45.627-84.785-37.026 6.362-78.648-4.149-90.071-45.357C5.603 115.832 0 42.822 0 32.957 0-16.44 42.893-.917 69.364 19.147Z"/>
  </svg>
  <text x="232" y="128" font-family="DejaVu Sans" font-weight="bold" font-size="64" fill="#ffffff">Bluesky</text>
  <text x="234" y="176" font-family="DejaVu Sans" font-size="28" fill="#e6f1ff">for Gladys Assistant</text>

  <!-- conversation (illustration) -->
  <g font-family="DejaVu Sans" font-size="19">
    <g filter="url(#shadow)">
      <rect x="56" y="256" width="330" height="58" rx="22" fill="#06306b" fill-opacity="0.3"/>
    </g>
    <rect x="56" y="250" width="330" height="58" rx="22" fill="#ffffff"/>
    <text x="78" y="286" fill="#0b1f3a">Is the garage door closed?</text>
    <g filter="url(#shadow)">
      <rect x="150" y="332" width="300" height="58" rx="22" fill="#06306b" fill-opacity="0.3"/>
    </g>
    <rect x="150" y="326" width="300" height="58" rx="22" fill="#0a7aff"/>
    <text x="172" y="362" fill="#ffffff">Yes, closed since 18:42.</text>
    <g filter="url(#shadow)">
      <rect x="56" y="408" width="230" height="58" rx="22" fill="#06306b" fill-opacity="0.3"/>
    </g>
    <rect x="56" y="402" width="230" height="58" rx="22" fill="#ffffff"/>
    <text x="78" y="438" fill="#0b1f3a">Thanks Gladys!</text>
  </g>

  <!-- notifications (illustration) -->
  <g font-family="DejaVu Sans" font-size="18" fill="#0b1f3a">
    <g filter="url(#shadow)">
      <rect x="500" y="256" width="244" height="62" rx="16" fill="#06306b" fill-opacity="0.3"/>
      <rect x="500" y="334" width="244" height="62" rx="16" fill="#06306b" fill-opacity="0.3"/>
      <rect x="500" y="412" width="244" height="62" rx="16" fill="#06306b" fill-opacity="0.3"/>
    </g>
    <rect x="500" y="250" width="244" height="62" rx="16" fill="#ffffff"/>
    <rect x="500" y="328" width="244" height="62" rx="16" fill="#ffffff"/>
    <rect x="500" y="406" width="244" height="62" rx="16" fill="#ffffff"/>
    <!-- mention -->
    <circle cx="534" cy="281" r="17" fill="#e3efff"/>
    <text x="534" y="288" font-size="20" font-weight="bold" fill="#0a7aff" text-anchor="middle">@</text>
    <text x="562" y="287">New mention</text>
    <!-- follower -->
    <circle cx="534" cy="359" r="17" fill="#e2f6ea"/>
    <g fill="none" stroke="#1d9b54" stroke-width="2.6" stroke-linecap="round">
      <circle cx="531" cy="354" r="5"/>
      <path d="M522 368 q9 -10 18 0"/>
      <path d="M543 352 v10 M538 357 h10"/>
    </g>
    <text x="562" y="365">+1 follower</text>
    <!-- like -->
    <circle cx="534" cy="437" r="17" fill="#ffe6ec"/>
    <path d="M534 446 l-9 -9 a5.5 5.5 0 0 1 9 -6.5 a5.5 5.5 0 0 1 9 6.5 z" fill="#ec4868"/>
    <text x="562" y="443">12 likes</text>
  </g>
</svg>
